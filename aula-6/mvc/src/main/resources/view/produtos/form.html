<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: estilos}"></th:block>
    <title>Produto</title>
</head>
<body>
<header th:replace="~{fragments/layout :: cabecalho('/produtos')}"></header>
<main>
    <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>
    <div class="card">
        <h2 th:text="${produto.id == null} ? 'Novo produto' : 'Editar produto'"></h2>
        <p th:if="${produto.id == null}">O produto será criado como <strong>INDISPONÍVEL</strong> e com estoque zero.</p>
        <p th:if="${produto.id != null}">Status atual:
            <span th:class="${'status status-' + produto.status}" th:text="${produto.status.descricao}"></span>
            – estoque: <strong th:text="${produto.quantidade}"></strong></p>

        <form th:action="@{/produtos}" th:object="${produto}" method="post">
            <input type="hidden" th:field="*{id}">

            <label for="nome">Nome</label>
            <input id="nome" type="text" th:field="*{nome}" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" th:field="*{descricao}" rows="3"></textarea>

            <label for="preco">Preço (R$)</label>
            <input id="preco" type="number" step="0.01" min="0" th:field="*{preco}" required>

            <p style="margin-top:16px">
                <button type="submit">Salvar</button>
                <a class="botao botao-sec" th:href="@{/produtos}">Voltar</a>
            </p>
        </form>
    </div>
</main>
</body>
</html>
